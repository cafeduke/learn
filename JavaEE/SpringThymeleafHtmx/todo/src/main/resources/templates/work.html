<!DOCTYPE html>
<!-- 1. The data-theme attribute forces a specific daisyUI theme -->
<html xmlns:th="http://thymeleaf.org" data-theme="emerald">

<head>
  <meta charset="UTF-8">
  <title>Spring Boot + daisyUI</title>
  <!-- 2. Link to the COMPILED output file generated by the maven-tailwind-plugin -->
  <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>

<body class="bg-base-200 min-h-screen p-6 flex flex-col gap-6">

  <!-- daisyUI Navbar Component -->
  <div class="navbar bg-base-100 shadow-xl rounded-box">
    <div class="flex-1">
      <a class="btn btn-ghost text-xl">Thymeleaf App</a>
    </div>
    <div class="flex-none">
      <button class="btn btn-primary">Login</button>
    </div>
  </div>

  <!-- daisyUI Hero Component with Thymeleaf Dynamic Text -->
  <div class="hero bg-base-100 p-10 rounded-box shadow-xl">
    <div class="hero-content text-center">
      <div class="max-w-md">
        <h1 class="text-5xl font-bold">Hello, daisyUI!</h1>
        <!-- Thymeleaf expression displaying a server variable if present -->
        <p class="py-6" th:text="${message != null} ? ${message} : 'Welcome to your Node-free Java frontend stack.'"></p>
        <button class="btn btn-secondary">Get Started</button>
        <button class="btn btn-outline btn-accent">Learn More</button>
      </div>
    </div>
  </div>

</body>

</html>
