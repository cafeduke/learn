<!doctype html>
<html xmlns:th="http://thymeleaf.org" th:data-theme="dukelight">
  <head>
    <meta charset="UTF-8" />
    <title>Word Bee</title>
    <!-- HTMX -->
    <script th:src="@{/js/htmx.min.js}"></script>
    <!-- DaisyUI and tailwind CSS -->
    <link th:href="@{/css/tailwind.css}" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <div th:replace="~{/fragments/navbar :: fragNavBar}"></div>

    <!--
      Working:
        - As the key is typed, a GET request is triggered after 300ms of inactivity (delay in typing)
        - The GET request is made to URL : /demoA/update?name=<input-text-typed>
        - Note that query string parameter key 'name' comes from the HTML attribute 'name'
        - The resultant HTML response snippet (generated by Controller) needs to be swapped with target '#demoA1'
        - However, the Controller method returns String 'home::fragDemoA1'
          - The Thymeleaf controller does NOT return HTML snippet as a String
          - The Thymeleaf controller returns path to the fragment as a String
          - The path to fragment has the format "path/to/html/filename-minus-extn :: fragment-name"
          - The path to HTML is relative to root 'resoures/templates'
          - Eg: home::fragDemoA1 refers to file resoures/templates/home.html and element having th:fragment='fragDemoA1'
        - The HTML element having th:fragment='fragDemoA1' will be rendered by replacing placeholders with values from Model
        - This way, Thymeleaf has now prepared the response HTML snippet
        - Where does this snippet go?
          - Where? The target is identified by 'hx:target'
          - How? It is swapped as per swapping rule in 'hx:swap'
        - In this case whatever snippet is at 'hx:target' is removed and replaced by the one prepared.
    -->
    <div class="card card-border shadow-sm md:w-8/10 m-auto mt-5 bg-base-100">
      <div class="card-body">
        <span class="card-title">DemoA: Echo input content into label</span>
        <div>
          <label class="input">
            <span class="label">Name</span>
            <input
              type="text"
              name="name"
              placeholder="your name"
              hx:get="@{/demoA/update}"
              hx:target="|#demoA1|"
              hx:trigger="|keyup changed delay:300ms|"
              hx:swap="outerHTML" />
          </label>

          <div id="demoA1" role="alert" class="mt-5 h-12 alert alert-info alert-soft" th:fragment="fragDemoA1">
            <span th:text="${name}"></span>
          </div>
        </div>
      </div>
    </div>

    <!--
      Working:
        - As the key is typed, a GET request is triggered after 300ms of inactivity (delay in typing)
        - The GET request is made to URL : /demoA/update?name=<input-text-typed>
        - The resultant HTML response snippet (generated by Controller) needs to be swapped with target '#demoB1'
        - However, the Controller method returns a List<ModelAndView>
          - Each ModelAndView object has a model and view
          - View  -- A String pointing to fragment (Eg: 'home::fragDemoB1')
          - Model -- A Map of place holder name to an object value
        - Multiple fragments as pointed to by the view in each ModelAndView object are identified
        - The placeholders in these fragments are replaced by the corresponding Model
        - We now have multiple ready to swap fragments (from response)
        - Where does these fragments go?
          - Where?
            - The swapping for fragDemoB1 is as usual target identified by 'hx:target'
            - Note the fragDemoB2 as 'hx-swap-oob' configured. This says 'Swap me with a response snippet matching CSS id'
            - OOB stands for Out-Of-Band
    -->
    <div class="card card-border shadow-sm md:w-8/10 m-auto mt-5 bg-base-100">
      <div class="card-body">
        <span class="card-title">DemoB: Update multiple inline fragments using OOB</span>
        <div>
          <label class="input">
            <span class="label">Name</span>
            <input
              type="text"
              name="name"
              placeholder="your name"
              hx:get="@{/demoB/update}"
              hx:target="|#demoB1|"
              hx:trigger="|keyup changed delay:300ms|"
              hx:swap="outerHTML" />
          </label>

          <div id="demoB1" role="alert" class="mt-5 h-12 alert alert-info alert-soft" th:fragment="fragDemoB1">
            <span th:text="${name}"></span>
          </div>

          <div id="demoB2" role="alert" class="mt-5 h-12 alert alert-success alert-soft" th:fragment="fragDemoB2" hx-swap-oob="true">
            <span th:text="${count}"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card card-border shadow-sm md:w-8/10 m-auto mt-5 bg-base-100">
      <div class="card-body">
        <span class="card-title">DemoC: Update multiple external fragments using OOB</span>
        <div>
          <label class="input">
            <span class="label">Name</span>
            <input
              type="text"
              name="name"
              placeholder="your name"
              hx:get="@{/demoC/update}"
              hx:target="|#demoC1|"
              hx:trigger="|keyup changed delay:300ms|"
              hx:swap="outerHTML" />
          </label>

          <div id="demoC1" th:replace="~{/fragments/demoC :: fragDemoC1}"></div>
          <div id="demoC2" th:replace="~{/fragments/demoC :: fragDemoC2}"></div>
        </div>
      </div>
    </div>
  </body>
</html>
