<div class="container text-center">
  <div class="row align-items-center">
    <div class="col">
      <span class="user-welcome">Welcome {{ username | titlecase }}</span>
    </div>
  </div>
  <div class="row align-items-center">
    <div class="col">

      <div class="btn-group" role="group" aria-label="Register and login">
        @if (hasLoggedIn)
        {
        <button type="button" routerLink="/logout" class="btn btn-danger btn-sm" title="logout" data-bs-toggle="tooltip" data-bs-placement="bottom">
          <i class="fa-solid fa-power-off"></i> Logout
        </button>
        }
        @else
        {
        <button type="button" routerLink="/login" class="btn btn-success btn-sm" title="login" data-bs-toggle="tooltip" data-bs-placement="bottom">
          <i class="fa-solid fa-user"></i> Login
        </button>
        <button type="button" routerLink="/register" class="btn btn-primary btn-sm" title="register" data-bs-toggle="tooltip" data-bs-placement="bottom">
          <i class="fa-solid fa-user-plus"></i> Register
        </button>
        }
      </div>

    </div>
  </div>
</div>
